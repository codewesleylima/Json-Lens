name: Build JSON Lens
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit tests and plugin archive
        run: bash ./gradlew clean test buildPlugin verifyPlugin verifyPluginStructure verifyPluginProjectConfiguration --stacktrace
      - name: Plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: json-lens-intellij-plugin
          path: build/distributions/*.zip
